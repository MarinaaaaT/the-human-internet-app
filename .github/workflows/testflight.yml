name: TestFlight

# SECURITY, load-bearing: this workflow has access to the signing secrets, so it
# must never run on code from a fork. That is enforced three ways:
#   1. There is no `pull_request` trigger, and above all no `pull_request_target`
#      — the latter runs the BASE repo's workflow with secrets available while
#      checking out an attacker's branch. Adding one here would hand the
#      distribution certificate to anyone who opens a PR.
#   2. GitHub withholds secrets from fork-originated runs by default. Nothing
#      below opts out of that.
#   3. The `if:` guard on the job pins it to this repository, so the workflow
#      is inert in any fork that copies it.
# The repo is public, so all three matter.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: >-
          fastlane lane to run. Leave as beta for a normal release build.
          signing_bootstrap is the one-off that mints signing material into
          the match repo — only pick it when DEPLOYMENT.md says to.
        type: choice
        options: [beta, signing_bootstrap]
        default: beta

# Two pushes in quick succession would otherwise race for the same build number
# and one upload would be rejected. Queue instead of cancelling: a cancelled run
# has usually already consumed its build number.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.repository == 'MarinaaaaT/the-human-internet-app'
    runs-on: macos-15
    timeout-minutes: 60

    env:
      # App Store Connect API key — uploads the build, and lets match talk to
      # the developer portal without an Apple ID or 2FA.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # match — decrypts the certs repo and authenticates the read of it.
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      # Monotonic across the repo's history and never reused, which is exactly
      # what App Store Connect requires of CFBundleVersion. Re-running a failed
      # run reuses its number, so a run that already uploaded cannot be re-run
      # blindly — push a new commit instead.
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # Pinned deliberately. Runner images roll their default Xcode forward
        # without notice, and a version bump is the single most common cause of
        # a build that was green yesterday going red today. Not needed for the
        # signing-only bootstrap lane, which never invokes xcodebuild.
        #
        # Was 16.4 (iOS 18.5 SDK) until App Store Connect started rejecting
        # uploads outright: "All iOS and iPadOS apps must be built with the
        # iOS 26 SDK or later, included in Xcode 26 or later." 26.3 is the
        # newest Xcode the macos-15 runner image has as of this pin.
        if: github.event.inputs.lane != 'signing_bootstrap'
        run: sudo xcode-select -switch /Applications/Xcode_26.3.app

      - name: Report toolchain versions
        if: github.event.inputs.lane != 'signing_bootstrap'
        run: |
          xcodebuild -version
          swift --version

      - name: Set up Ruby and install fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache Swift packages
        if: github.event.inputs.lane != 'signing_bootstrap'
        uses: actions/cache@v4
        with:
          path: SourcePackages
          # Package.resolved pins exact versions, so it is the correct key: a
          # dependency bump changes the file and correctly misses the cache.
          key: ${{ runner.os }}-spm-${{ hashFiles('the-human-internet/the-human-internet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run fastlane lane
        # push events carry no `inputs`, so this always resolves to `beta` for
        # the normal push-to-main trigger; workflow_dispatch is the only way
        # to pick signing_bootstrap.
        run: bundle exec fastlane ${{ github.event.inputs.lane || 'beta' }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            ~/Library/Logs/fastlane
            fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Discord
        # Plain curl to a Discord webhook rather than a marketplace Discord
        # action — this repo is public and the job already holds signing
        # secrets, so it doesn't get a new third-party action added to that
        # trust boundary just for a chat notification. Skips silently (not a
        # failure) if DISCORD_WEBHOOK_URL isn't set, so this is optional.
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          LANE: ${{ github.event.inputs.lane || 'beta' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping Discord notification"
            exit 0
          fi

          case "$STATUS" in
            success) emoji="✅" ; color=3066993 ;;
            failure) emoji="❌" ; color=15158332 ;;
            cancelled) emoji="⏹️" ; color=9807270 ;;
            *) emoji="❓" ; color=0 ;;
          esac

          short_sha="${COMMIT_SHA:0:7}"
          first_line="${COMMIT_MSG%%$'\n'*}"
          description="Commit \`$short_sha\` on \`$REF_NAME\` by $ACTOR"
          if [ -n "$first_line" ]; then
            description="$description"$'\n'"$first_line"
          fi

          payload=$(jq -n \
            --arg title "$emoji the-human-internet-app — $LANE $STATUS" \
            --arg url "$RUN_URL" \
            --arg description "$description" \
            --argjson color "$color" \
            '{embeds: [{title: $title, url: $url, description: $description, color: $color}]}')

          curl -sf -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
